default:
  repo: privacy-com/lithic-schemas
  branch: john-open-api-1
  output_module_path: "ledger_api_generated/generated"
  args: >
    --input-file-type jsonschema
    --target-python-version 3.11
    --use-title-as-name
    --reuse-model
    --use-pendulum
    --base-class ledger_api_generated.common.BaseResponse

sources:
  - input: jsonschema/customer-facing/treasury/ledger/unified_base_transaction.json
  - input: jsonschema/customer-facing/treasury/ledger/financial_transaction.json
  - input: jsonschema/customer-facing/treasury/ledger/transaction_status.json
  - input: jsonschema/customer-facing/treasury/ledger/transaction_direction.json
  - input: jsonschema/customer-facing/treasury/ledger/transaction_category.json
